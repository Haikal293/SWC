<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="brand">EXAM<span>SYS</span></div>
      <h1>Exam Management System</h1>
      <p class="muted">Secure RESTful Web API Frontend</p>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="student@university.edu" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="Password" required>
        <button class="btn primary" type="submit">Login</button>
      </form>
      <div id="loginMessage" class="message"></div>
      <div class="demo-box">
        <b>Demo accounts</b><br>
        Student: ali@student.edu / student123<br>
        Lecturer: ahmad@university.edu / lecturer123<br>
        Admin: admin@university.edu / admin123
      </div>
    </div>
  </div>

  <div id="appPage" class="app hidden">
    <aside class="sidebar">
      <div class="brand">EXAM<span>SYS</span></div>
      <div class="user-box">
        <strong id="userName">User</strong>
        <small id="userRole">Role</small>
      </div>
      <nav id="nav"></nav>
      <button id="logoutBtn" class="btn logout">Logout</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">SWC3633</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div id="apiStatus" class="status">API: not connected</div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
